<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Embedded Signup</title>
</head>
<body style="font-family: Helvetica, Arial, sans-serif; padding: 40px; text-align: center;">

  <!-- SDK loading -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    // SDK initialization
    window.fbAsyncInit = function() {
      FB.init({
        appId: '1640886047680153', // your app ID goes here
        autoLogAppEvents: true,
        xfbml: true,
        version: 'v21.0' // Graph API version goes here
      });
    };

    // Session logging message event listener
    window.addEventListener('message', (event) => {
      if (!event.origin.endsWith('facebook.com')) return;
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'WA_EMBEDDED_SIGNUP') {
          console.log('message event: ', data); // remove after testing
          document.getElementById('output').textContent += '\nEvent: ' + JSON.stringify(data, null, 2);
        }
      } catch {
        console.log('message event: ', event.data); // remove after testing
        document.getElementById('output').textContent += '\nEvent (raw): ' + event.data;
      }
    });

    // Response callback
    const fbLoginCallback = (response) => {
      if (response.authResponse) {
        const code = response.authResponse.code;
        console.log('response: ', code); // remove after testing
        document.getElementById('output').textContent += '\n\nAuth Code: ' + code;
        if (response.authResponse.accessToken) {
          document.getElementById('output').textContent += '\nAccess Token: ' + response.authResponse.accessToken;
        }
      } else {
        console.log('response: ', response); // remove after testing
        document.getElementById('output').textContent += '\nResponse: ' + JSON.stringify(response, null, 2);
      }
    };

    // Launch method and callback registration
    const launchWhatsAppSignup = () => {
      FB.login(fbLoginCallback, {
        config_id: '1147136831313018', // your configuration ID goes here
        response_type: 'code',
        override_default_response_type: true,
        extras: {
          setup: {},
        }
      });
    };
  </script>

  <!-- Launch button -->
  <button onclick="launchWhatsAppSignup()" style="background-color: #1877f2; border: 0; border-radius: 4px; color: #fff; cursor: pointer; font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; height: 40px; padding: 0 24px;">Login with Facebook</button>

  <pre id="output" style="margin-top: 30px; text-align: left; background: #f4f4f4; padding: 15px; border-radius: 4px; font-size: 13px; white-space: pre-wrap; word-break: break-all; max-width: 700px; margin-left: auto; margin-right: auto;"></pre>

</body>
</html>
