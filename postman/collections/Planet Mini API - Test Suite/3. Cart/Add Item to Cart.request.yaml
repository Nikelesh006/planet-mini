$kind: http-request
description: Adds an item with quantity, size, and color to the user's cart.
url: "{{baseUrl}}/api/cart"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 1,
      "size": "3-6M",
      "color": "Blue"
    }
order: 2000
