$kind: http-request
description: Save a new delivery address.
url: "{{baseUrl}}/api/addresses"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "fullName": "Rahul Sharma",
      "phone": "9876543210",
      "pincode": "600001",
      "street": "123 Park Avenue, Anna Nagar",
      "city": "Chennai",
      "state": "Tamil Nadu"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          const data = pm.response.json();
          if (data.address && (data.address.id || data.address._id)) {
              pm.collectionVariables.set('addressId', data.address.id || data.address._id);
          }
      }
    language: text/javascript
order: 2000
