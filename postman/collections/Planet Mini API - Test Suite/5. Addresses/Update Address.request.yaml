$kind: http-request
description: Updates an existing delivery address.
url: "{{baseUrl}}/api/addresses/{{addressId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "fullName": "Rahul Sharma",
      "phone": "9876543210",
      "pincode": "600001",
      "street": "Flat 4B, Emerald Towers, Anna Nagar",
      "city": "Chennai",
      "state": "Tamil Nadu"
    }
order: 3000
