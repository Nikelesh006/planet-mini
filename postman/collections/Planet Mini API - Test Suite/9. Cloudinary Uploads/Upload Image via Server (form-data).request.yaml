$kind: http-request
description: Server-side image upload route using Multer & Cloudinary.
url: "{{baseUrl}}/api/upload/image"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: formdata
  content:
    - type: file
      key: image
      src: []
      description: Select an image file (PNG/JPEG under 4MB)
    - type: text
      key: folder
      value: profiles
order: 2000
