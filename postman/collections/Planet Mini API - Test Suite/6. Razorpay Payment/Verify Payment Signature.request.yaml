$kind: http-request
description: Verifies HMAC SHA256 payment signature.
url: "{{baseUrl}}/api/payment/verify"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "razorpay_order_id": "order_test_123",
      "razorpay_payment_id": "pay_test_456",
      "razorpay_signature": "test_signature_hex"
    }
order: 2000
