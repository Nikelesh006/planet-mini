$kind: http-request
name: Register / Get Spin Wheel User
description: Registers phone and email for spin eligibility.
url: "{{baseUrl}}/api/spin-wheel/user"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phone": "9876543210",
      "email": "testuser@example.com",
      "termsAccepted": true
    }
order: 2000
