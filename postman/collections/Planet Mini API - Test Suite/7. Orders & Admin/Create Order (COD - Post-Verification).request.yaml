$kind: http-request
name: Create Order (COD / Post-Verification)
description: Creates an order record in database. Triggers WhatsApp notification if paid.
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "{{productId}}",
          "name": "Baby Cotton Onesie",
          "quantity": 1,
          "price": 499,
          "size": "3-6M",
          "color": "Blue"
        }
      ],
      "total": 499,
      "paymentMethod": "cod",
      "paymentStatus": "pending",
      "shippingAddress": {
        "fullName": "Rahul Sharma",
        "phone": "9876543210",
        "street": "123 Park Avenue",
        "city": "Chennai",
        "state": "Tamil Nadu",
        "pincode": "600001"
      }
    }
order: 1000
