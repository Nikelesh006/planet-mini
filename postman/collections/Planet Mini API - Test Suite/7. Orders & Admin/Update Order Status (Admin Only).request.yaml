$kind: http-request
description: Admin endpoint to update fulfillment status of an order.
url: "{{baseUrl}}/api/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "shipped",
      "trackingNumber": "AWB123456789",
      "carrier": "Delhivery"
    }
order: 4000
