$kind: http-request
description: Admin endpoint to insert a new product.
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "name": "Baby Organic Cotton Onesie",
      "slug": "baby-organic-cotton-onesie",
      "description": "100% breathable organic cotton for baby comfort",
      "category": "Clothing",
      "sellingPrice": 499,
      "mrp": 799,
      "stockQuantity": 50,
      "inStock": true,
      "image": "https://res.cloudinary.com/demo/image/upload/sample.jpg",
      "sizes": "0-3M, 3-6M, 6-12M",
      "colors": "Blue, White",
      "status": "Active"
    }
order: 5000
