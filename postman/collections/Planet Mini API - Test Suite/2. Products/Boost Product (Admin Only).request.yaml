$kind: http-request
description: Boosts product ranking to the top of listings.
url: "{{baseUrl}}/api/products/{{productId}}/boost"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "isBoosted": true
    }
order: 7000
